<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quetzalito Player</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; background:#000;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    overflow:hidden;
  }
  #wrap {
    position:relative; width:100%; height:100vh; background:#000;
  }

  /* ==== Tema Quetzalito para Plyr ==== */
  :root {
    --plyr-color-main: #00c896;
    --plyr-video-background: #000;
    --plyr-menu-background: rgba(15, 15, 15, 0.95);
    --plyr-menu-color: #eaeaea;
    --plyr-control-icon-size: 18px;
    --plyr-control-spacing: 10px;
    --plyr-video-control-color: #fff;
    --plyr-video-control-color-hover: #000;
    --plyr-video-control-background-hover: #00c896;
    --plyr-tooltip-background: #111;
    --plyr-tooltip-color: #fff;
  }
  .plyr { height:100%; --plyr-badge-background:#00c896; }
  .plyr__video-wrapper { height:100%; }
  .plyr--video { border-radius:0; }
  .plyr__control--overlaid { background: rgba(0, 200, 150, 0.85); }
  .plyr__control--overlaid:hover { background:#00c896; }
  .plyr__progress__buffer { color: rgba(255,255,255,0.25); }

  /* Marca de agua sutil */
  #brand {
    position:absolute; top:16px; left:18px; z-index:6;
    display:flex; align-items:center; gap:8px;
    opacity:0.9; pointer-events:none;
    transition: opacity .3s ease;
  }
  #brand span {
    color:#fff; font-weight:700; font-size:14px;
    text-shadow:0 1px 4px rgba(0,0,0,0.6);
    letter-spacing:0.5px;
  }

  /* ==== Pantalla de estado (loading / error) ==== */
  #status {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    color:#00c896; font-size:15px; text-align:center;
    background:#050505; z-index:10; padding:20px;
  }
  #status.hidden { display:none; }
  .spinner {
    width:46px; height:46px; border:4px solid rgba(0,200,150,0.15);
    border-top-color:#00c896; border-radius:50%;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #errBox { color:#ff6767; font-size:14px; max-width:85%; line-height:1.5; }
  #retryBtn {
    margin-top:6px; padding:9px 22px; border:none; border-radius:8px;
    background:#00c896; color:#04150f; font-weight:700; cursor:pointer;
    font-size:14px; letter-spacing:0.3px;
    transition: transform .15s ease, background .15s ease;
  }
  #retryBtn:hover { background:#02e6ad; transform:scale(1.03); }
</style>
</head>
<body>

<div id="wrap">
  <div id="brand"><span>🦜 Quetzalito</span></div>

  <video id="player" playsinline controls></video>

  <div id="status">
    <div class="spinner"></div>
    <div id="statusText">Cargando stream...</div>
  </div>
</div>

<script>
  // ================= CONFIGURACIÓN =================
  const STREAM_URL = "https://up4.filetolinkborbot.pics/uploader/getStream.php?l=2124101156-83pDLH9P";
  const CUSTOM_HEADERS = {
    // "Referer": "https://tudominio.com/",
    // "User-Agent": "Mozilla/5.0"
  };
  // ===================================================

  const videoEl = document.getElementById('player');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');

  const player = new Plyr(videoEl, {
    controls: [
      'play-large', 'rewind', 'play', 'fast-forward',
      'progress', 'current-time', 'duration',
      'mute', 'volume', 'captions', 'settings',
      'pip', 'airplay', 'fullscreen'
    ],
    settings: ['quality', 'speed'],
    seekTime: 10,
    tooltips: { controls: true, seek: true },
    keyboard: { focused: true, global: true },
    fullscreen: { enabled: true, iosNative: true }
  });

  function showError(msg) {
    statusEl.classList.remove('hidden');
    statusEl.innerHTML = `
      <div id="errBox">⚠️ ${msg}</div>
      <button id="retryBtn" onclick="location.reload()">Reintentar</button>
    `;
  }
  function hideStatus() { statusEl.classList.add('hidden'); }

  function isM3U8(url) { return url.toLowerCase().includes('.m3u8'); }

  function attachHls(url) {
    if (Hls.isSupported()) {
      const hls = new Hls({
        xhrSetup: (xhr) => {
          for (const k in CUSTOM_HEADERS) xhr.setRequestHeader(k, CUSTOM_HEADERS[k]);
        }
      });
      hls.loadSource(url);
      hls.attachMedia(videoEl);

      hls.on(Hls.Events.MANIFEST_PARSED, (e, data) => {
        hideStatus();
        const availableQualities = data.levels.map(l => l.height).filter(Boolean);
        if (availableQualities.length) {
          player.config.quality = {
            default: availableQualities[0],
            options: availableQualities,
            forced: true,
            onChange: (q) => {
              hls.levels.forEach((level, i) => {
                if (level.height === q) hls.currentLevel = i;
              });
            }
          };
        }
        player.play().catch(()=>{});
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              showError("Error de red al cargar el stream (posible bloqueo CORS, Referer inválido o enlace expirado).");
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              statusText.textContent = "Recuperando reproducción...";
              hls.recoverMediaError();
              break;
            default:
              showError("Error fatal reproduciendo el stream.");
              break;
          }
        }
      });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = url;
      videoEl.addEventListener('loadedmetadata', hideStatus);
      player.play().catch(()=>{});
    } else {
      showError("Tu navegador no soporta reproducción HLS.");
    }
  }

  function loadStream(url) {
    if (isM3U8(url)) { attachHls(url); return; }

    videoEl.src = url;
    let triedHls = false;

    videoEl.addEventListener('error', function onErr() {
      if (!triedHls) {
        triedHls = true;
        videoEl.removeEventListener('error', onErr);
        attachHls(url);
      } else {
        showError("No se pudo cargar el stream. Verifica el enlace o los headers (Referer/User-Agent) requeridos por el servidor.");
      }
    });

    videoEl.addEventListener('loadedmetadata', hideStatus);
    videoEl.addEventListener('canplay', hideStatus);
  }

  loadStream(STREAM_URL);

  setTimeout(() => {
    if (!statusEl.classList.contains('hidden') && videoEl.readyState === 0) {
      showError("Tiempo de espera agotado. El servidor no respondió o el enlace requiere headers especiales.");
    }
  }, 15000);
</script>

</body>
</html>
