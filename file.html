<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>

<link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .video-js {
    width: 100vw;
    height: 100vh;
  }
  .vjs-tech {
    object-fit: contain;
  }
  .video-js .vjs-big-play-button {
    top: 50%;
    left: 50%;
    margin-top: -0.9em;
    margin-left: -1.5em;
  }
</style>
</head>
<body>

<video
  id="player"
  class="video-js vjs-default-skin vjs-big-play-centered"
  controls
  autoplay
  playsinline
  preload="auto">
</video>

<script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>

<script>
  const STREAM_URL = "https://ne16-ed2e5e137f7c.herokuapp.com/stream/3210235?hash=056b83&d=true";

  const player = videojs('player', {
    autoplay: true,
    controls: true,
    fluid: false,
    responsive: true,
    preload: 'auto',
    sources: [{
      src: STREAM_URL,
      type: 'video/mp4'
    }]
  });

  player.ready(function () {
    player.play().catch(() => {
      // El navegador puede bloquear autoplay con audio; esperamos interacción
    });
  });

  player.on('error', function () {
    console.error('Video.js error:', player.error());
  });
</script>

</body>
</html>
